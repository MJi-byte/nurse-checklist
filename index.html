<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>เช็คลิสต์พยาบาล</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1514;--c:#122322;--c2:#1a302e;--ink:#e6f2f0;--mu:#8fb0ac;--ln:#243f3c;--ac:#3fd0c9;--wn:#f2b544;--rd:#ff6b5e;--ok:#4fdca0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#eef5f4;--c:#fff;--c2:#f1f7f6;--ink:#12302f;--mu:#5d7573;--ln:#d3dfdd;--ac:#0b6e6e;--wn:#a86a0a;--rd:#c0392b;--ok:#2f855a;color-scheme:light}
:root[data-theme="dark"]{--c2:#1a302e;--bg:#0e1b1b;--c:#162a29;--ink:#e3efed;--mu:#97b0ad;--ln:#2a4442;--ac:#4fc3c0;--wn:#e0a030;--rd:#ff7b6b;--ok:#5fd09a;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans Thai",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--ac);color:#fff}
header b{font-size:18px}header span{opacity:.9;font-size:13px}main{max-width:980px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--c);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px}
.bed{cursor:pointer;margin:0;border-left:6px solid var(--ln)}.bed.r{border-left-color:var(--rd)}.bed.w{border-left-color:var(--wn)}.bed.g{border-left-color:var(--ok)}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;border:1px solid var(--ln);color:var(--mu)}
.chip.r{background:var(--rd);color:#fff;border-color:var(--rd)}.chip.w{background:var(--wn);color:#fff;border-color:var(--wn)}.chip.g{background:var(--ok);color:#fff;border-color:var(--ok)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:10px 0}.tabs button{white-space:nowrap}
button,input,select,textarea{font:inherit;color:var(--ink);background:var(--c);border:1px solid var(--ln);border-radius:7px;padding:6px 10px}
button{cursor:pointer}button.p,.tabs .on{background:var(--ac);color:#fff;border-color:var(--ac)}button.d{color:var(--rd)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.f{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.f input,.f select{width:auto;max-width:150px}
.al{background:var(--c);border:1px solid var(--rd);border-radius:10px;padding:8px 12px;margin-bottom:10px;color:var(--rd)}
.bar{height:6px;background:var(--ln);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln)}
h3{margin:4px 0 6px;font-size:16px}.mu{color:var(--mu);font-size:13px}label.k{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
textarea{width:100%;min-height:200px}.sc{overflow-x:auto}
body{background:radial-gradient(800px 420px at 90% -5%,#3fd0c924,transparent),var(--bg);min-height:100vh}
header{background:linear-gradient(120deg,var(--c),var(--c2));color:var(--ink);border-bottom:1px solid var(--ln)}header b{font-size:19px}header span{color:var(--ac);font-weight:600;opacity:1}
.card{border-radius:16px;box-shadow:0 10px 28px #0003}button,input,select,textarea{background:var(--c2);border-radius:10px}button:hover{border-color:var(--ac)}
button.p,.tabs .on{color:#06201f;font-weight:600}.chip.r,.chip.w,.chip.g{color:#06201f;font-weight:600}
.nav{display:flex;gap:6px;margin-bottom:12px;align-items:center;flex-wrap:wrap}.nav button{border-radius:99px}.nav .on{background:var(--ac);color:#06201f;border-color:var(--ac);font-weight:600}
.hero{padding:4px 2px 14px}.hero h1{margin:0;font-size:28px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}.st{background:var(--c);border:1px solid var(--ln);border-radius:16px;padding:14px}.st b{display:block;font-size:32px;line-height:1.1}.st.r b{color:var(--rd)}.st.w b{color:var(--wn)}.st.g b{color:var(--ok)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}.two .card{margin:0}
.map{display:flex;flex-wrap:wrap;gap:8px}.bd{min-width:72px;padding:10px 8px;border-radius:12px;text-align:center;cursor:pointer;border:1px solid var(--ln);background:var(--c2)}.bd.g{background:#4fdca020;border-color:var(--ok)}.bd.w{background:#f2b54428;border-color:var(--wn)}.bd.r{background:#ff6b5e30;border-color:var(--rd)}
.tl{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln);cursor:pointer}.tl time{min-width:64px;font-weight:600}details{padding:6px 0;border-bottom:1px solid var(--ln)}summary{cursor:pointer}
input[type=checkbox]{width:22px;height:22px;flex:none}
.f .on{background:var(--ac);color:#06201f;border-color:var(--ac);font-weight:600}.tl{flex-wrap:wrap}
@media (max-width:640px){button,input:not([type=checkbox]),select{min-height:46px;font-size:16px}.f input:not([type=checkbox]),.f select{max-width:none;flex:1 1 90px}main{padding:10px}.nav button,.tabs button{padding:8px 14px}}
</style></head><body>
<header><b>เช็คลิสต์การทำงานพยาบาล</b><span id="sh"></span></header><main id="app"></main>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={p:[],h:[]},U={v:'h',t:'dx',w:2,tf:'all'};
try{S=JSON.parse(localStorage.getItem('nck1'))||S}catch(e){}
const save=()=>{try{localStorage.setItem('nck1',JSON.stringify(S))}catch(e){}render()};
const P=()=>S.p[U.v],val=i=>$(i).value.trim(),num=i=>parseFloat($(i).value);
const DX={
DM:['เบาหวาน (DM)',[['เสี่ยงน้ำตาลผิดปกติ',['ตรวจ DTX ตามแผน','ให้ยา/insulin ตามสั่ง','เฝ้าระวัง hypo/hyper']],['ขาดความรู้ดูแลตนเอง',['สอนอาหาร ยา ดูแลเท้า']]]],
HT:['ความดันโลหิตสูง (HT)',[['เสี่ยงภาวะแทรกซ้อนจากความดันสูง',['วัด BP ตามแผน','ให้ยาลดความดันตามสั่ง','ถามปวดศีรษะ/ตามัว']],['ขาดความรู้เรื่องลดเค็ม/ยา',['สอนลดโซเดียมและกินยาสม่ำเสมอ']]]],
HF:['หัวใจล้มเหลว (HF)',[['สารน้ำเกิน',['บันทึก I/O ชั่งน้ำหนักทุกวัน','จำกัดน้ำ/เกลือตามสั่ง','ฟังปอด ดูบวมกดบุ๋ม']],['แลกเปลี่ยนก๊าซลดลง',['จัดท่า Fowler','ให้ O2 ตามสั่ง ติดตาม SpO2']]]],
COPD:['COPD',[['ระบายอากาศไม่มีประสิทธิภาพ',['พ่นยา/ให้ O2 ตามสั่ง','สอน pursed-lip breathing','ติดตาม SpO2 RR']],['เสี่ยงติดเชื้อทางเดินหายใจ',['กระตุ้นไอ/ดูดเสมหะเมื่อจำเป็น']]]],
PNEU:['ปอดอักเสบ',[['แลกเปลี่ยนก๊าซบกพร่อง',['จัดท่าศีรษะสูง','ให้ O2 ติดตาม SpO2','ให้ยาปฏิชีวนะตรงเวลา']],['ไข้สูง/ขาดน้ำ',['วัดไข้ ลดไข้','ส่งเสริมดื่มน้ำ']]]],
POP:['หลังผ่าตัด (Post-op)',[['ปวดแผลผ่าตัด',['ประเมิน pain score','ให้ยาแก้ปวดตามสั่ง']],['เสี่ยงติดเชื้อ/แผลแยก',['ทำแผล ดูสิ่งคัดหลั่ง','วัดไข้']],['เสี่ยงแทรกซ้อนจากการนอนนาน',['กระตุ้นหายใจลึก/ลุกเดินเร็ว','พลิกตัวทุก 2 ชม.']]]],
SEP:['ติดเชื้อในกระแสเลือด (Sepsis)',[['เสี่ยงอวัยวะล้มเหลว',['ติดตาม V/S และ NEWS ถี่','ให้ยาปฏิชีวนะภายใน 1 ชม.','ติดตาม lactate/ปัสสาวะ']],['สารน้ำพร่อง',['ให้สารน้ำตามสั่ง','บันทึก I/O ทุกชม.']]]],
SHK:['ภาวะช็อก (Shock)',[['เลือดไปเลี้ยงเนื้อเยื่อไม่พอ',['วัด BP/MAP ตามแผน','ปรับ vasopressor ตามสั่ง','ประเมิน CRT']],['สารน้ำพร่อง',['ให้สารน้ำ/เลือดตามสั่ง','บันทึกปัสสาวะรายชั่วโมง']]]],
RF:['ระบบหายใจล้มเหลว',[['หายใจไม่มีประสิทธิภาพ',['ประเมิน RR SpO2 ABG','ดูแลทางเดินหายใจ/เครื่องช่วยหายใจ','ดูดเสมหะเมื่อจำเป็น']],['เสี่ยง VAP',['ยกศีรษะ 30-45°','ทำความสะอาดช่องปาก']]]],
CKD:['ไตเรื้อรัง (CKD)',[['สารน้ำและอิเล็กโทรไลต์ไม่สมดุล',['บันทึก I/O ชั่งน้ำหนัก','ติดตาม K Cr','จำกัดน้ำ/โปแตสเซียมตามสั่ง']],['ขาดความรู้ดูแลตนเอง',['สอนอาหารและดูแลสายล้างไต']]]],
STR:['หลอดเลือดสมอง (Stroke)',[['เลือดไปเลี้ยงสมองไม่พอ',['ประเมิน GCS/neuro sign ตามแผน','คุมความดันตามสั่ง','ยกศีรษะตามแผน']],['เสี่ยงสำลัก/ตกเตียง/แผลกดทับ',['ทดสอบการกลืนก่อนให้อาหาร','ยกไม้กั้นเตียง','พลิกตัวทุก 2 ชม.']]]]};
const DEPTS=['อายุรกรรม','ศัลยกรรม','ออร์โธปิดิกส์','ตา','ประสาทวิทยา','มะเร็ง','โลหิตวิทยา','ทางเดินอาหาร/ตับ','วิกฤต (ICU)','สูติ-นรีเวช','กุมารเวช','จิตเวช','หู คอ จมูก'];
['DM','HT','HF','COPD','PNEU','CKD'].forEach(k=>DX[k][2]='อายุรกรรม');DX.POP[2]='ศัลยกรรม';['SEP','SHK','RF'].forEach(k=>DX[k][2]='วิกฤต (ICU)');DX.STR[2]='ประสาทวิทยา';
const A=(k,n,g,s)=>{DX[k]=[n,s.split(';').map(x=>{const i=x.indexOf(':'),a=i<0?x:x.slice(0,i),b=i<0?'ประเมินและติดตามตามแผนการพยาบาล':x.slice(i+1);return[a.trim(),b.split('|').map(t=>t.trim()).filter(Boolean)]}),g]};
A('ACS','กล้ามเนื้อหัวใจขาดเลือด (ACS)','อายุรกรรม','ปวดเจ็บหน้าอก:ประเมิน pain score/EKG ตามสั่ง|ให้ O2 และยาตามสั่ง;เสี่ยงหัวใจเต้นผิดจังหวะ:ติดตาม EKG monitor|เตรียมอุปกรณ์ช่วยฟื้นคืนชีพ');
A('DKA','ภาวะ DKA/HHS','อายุรกรรม','น้ำตาลและกรด-ด่างผิดปกติ:ตรวจ DTX/ketone ตามแผน|ให้ insulin drip ตามสั่ง|ติดตาม K, HCO3;ขาดน้ำ:ให้สารน้ำตามสั่ง|บันทึก I/O ทุกชม.');
A('TB','วัณโรคปอด','อายุรกรรม','แลกเปลี่ยนก๊าซบกพร่อง:จัดท่าศีรษะสูง|ติดตาม SpO2;เสี่ยงแพร่เชื้อ:แยกผู้ป่วย ใส่ N95|สอนปิดปากเมื่อไอและกินยาต่อเนื่อง');
A('APP','ไส้ติ่งอักเสบ/หลังผ่าตัดช่องท้อง','ศัลยกรรม','ปวดท้อง/ปวดแผล:ประเมิน pain score|ให้ยาแก้ปวดตามสั่ง;เสี่ยงลำไส้ไม่ทำงาน/ติดเชื้อ:ฟังเสียงลำไส้ ดูท้องอืด|ดูแลแผลและวัดไข้');
A('TRM','บาดเจ็บหลายระบบ (Trauma)','ศัลยกรรม','เสี่ยงเสียเลือด/ช็อก:ประเมิน V/S ถี่|ให้สารน้ำ/เลือดตามสั่ง;เสี่ยงทางเดินหายใจอุดกั้น:เปิดทางเดินหายใจ|ประเมิน GCS และ SpO2');
A('BRN','แผลไฟไหม้น้ำร้อนลวก','ศัลยกรรม','สูญเสียสารน้ำ:ให้สารน้ำตามสูตร|บันทึกปัสสาวะรายชั่วโมง;เสี่ยงติดเชื้อแผลไหม้:ทำแผลปราศจากเชื้อ|ประเมินและบรรเทาปวด');
A('FX','กระดูกหัก/ใส่เฝือก','ออร์โธปิดิกส์','ปวด/บวม:ยกอวัยวะสูง ประคบเย็น|ให้ยาแก้ปวดตามสั่ง;เสี่ยงเลือดไปเลี้ยงปลายมือเท้าลดลง:ประเมิน 5P (สี อุณหภูมิ ชีพจร ชา ขยับ)|ดูแลเฝือก/แรงดึงถ่วง');
A('THR','ผ่าตัดข้อสะโพก/เข่าเทียม','ออร์โธปิดิกส์','เสี่ยงข้อเทียมเคลื่อน:จัดท่าตามข้อห้าม|วางหมอนคั่นระหว่างขา;เสี่ยงลิ่มเลือดอุดตัน:กระตุ้นขยับข้อเท้า|ให้ยากันเลือดแข็งตามสั่ง');
A('SPN','ผ่าตัดกระดูกสันหลัง/ไขสันหลังบาดเจ็บ','ออร์โธปิดิกส์','เสี่ยงระบบประสาทบกพร่อง:ประเมินแรงและความรู้สึกขา|พลิกตัวท่อนซุง;เสี่ยงแผลกดทับ/ปัสสาวะคั่ง:พลิกตัวทุก 2 ชม.|ดูแลสายสวนปัสสาวะ');
A('CAT','ผ่าตัดต้อกระจก','ตา','เสี่ยงติดเชื้อ/ความดันตาสูง:หยอดยาตามสั่งโดยล้างมือ|ครอบตา ห้ามขยี้;เสี่ยงอุบัติเหตุจากการมองเห็นลดลง:ยกไม้กั้นเตียง|แนะนำสิ่งแวดล้อม');
A('GLA','ต้อหิน','ตา','ปวดตา/ความดันตาสูง:ให้ยาลดความดันตาตามสั่ง|ประเมินปวดตา คลื่นไส้;ขาดความรู้:สอนหยอดยาสม่ำเสมอ|ย้ำมาตรวจตามนัด');
A('RD','จอประสาทตาลอก','ตา','เสี่ยงจอตาลอกเพิ่ม:จัดท่านอนตามแพทย์สั่ง|จำกัดการเคลื่อนไหวศีรษะ;เสี่ยงตกเตียง:อธิบายสิ่งแวดล้อม|ยกไม้กั้นเตียง');
A('TBI','บาดเจ็บศีรษะ/สมอง','ประสาทวิทยา','เสี่ยงความดันในกะโหลกสูง:ประเมิน GCS/รูม่านตา|ยกศีรษะ 30°;เสี่ยงชัก/สำลัก:ระวังการชัก ยกไม้กั้นเตียง|งดน้ำอาหารถ้าความรู้สึกตัวลดลง');
A('SEI','ชัก (Seizure)','ประสาทวิทยา','เสี่ยงชักซ้ำ/บาดเจ็บ:ให้ยากันชักตรงเวลา|จัดสิ่งแวดล้อมปลอดภัย;เสี่ยงทางเดินหายใจอุดกั้น:จัดท่านอนตะแคงขณะชัก|จับเวลาและบันทึกลักษณะชัก');
A('MEN','เยื่อหุ้มสมองอักเสบ','ประสาทวิทยา','ไข้สูง/ปวดศีรษะ:ให้ยาลดไข้ แก้ปวดตามสั่ง|ลดแสงและเสียงรบกวน;เสี่ยงภาวะแทรกซ้อน:ให้ยาปฏิชีวนะตรงเวลา|ประเมิน GCS และคอแข็ง');
A('CHEMO','ได้รับเคมีบำบัด','มะเร็ง','เสี่ยงติดเชื้อ ภูมิต้านทานต่ำ:ติดตาม CBC/ANC|ล้างมือ ป้องกันการติดเชื้อ;คลื่นไส้อาเจียน:ให้ยาแก้อาเจียนก่อนเคมี|ประเมินเยื่อบุปากอักเสบ');
A('RT','ฉายรังสีรักษา','มะเร็ง','ผิวหนังระคายเคืองจากรังสี:ดูแลผิวบริเวณฉายแสง|หลีกเลี่ยงการขัดถู;เบื่ออาหาร/อ่อนเพลีย:ส่งเสริมโภชนาการ|ประเมินอาการข้างเคียง');

<div class="card"><div class="row"><h3>ประวัติเวร</h3>${(S.h||[]).length?`<button class="d" onclick="hClr()">${U.cf?'กดอีกครั้งเพื่อยืนยันลบทั้งหมด':'ลบทั้งหมด'}</button>`:''}</div>${(S.h||[]).map((q,i)=>[q,i]).reverse().slice(0,8).map(([q,i])=>`<details><summary>${new Date(q.t).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} ${esc(q.sh)}${q.nt?' · '+esc(q.nt):''} · ${q.p.length} เตียง · เฉลี่ย ${q.p.length?Math.round(q.p.reduce((a,x)=>a+x.g,0)/q.p.length):0}%</summary>${q.p.map(x=>`<div class="mu">เตียง ${esc(x.b)} ${esc(x.n)} · เช็คลิสต์ ${x.g}%${x.s!=null?' · NEWS '+x.s:''}${x.u.length?' · ค้าง: '+esc(x.u.join('; ')):''}</div>`).join('')}<div class="f"><select id="hs${i}">${['เวรเช้า 08-16','เวรบ่าย 16-24','เวรดึก 00-08'].map(s=>`<option ${s===q.sh?'selected':''}>${s}</option>`).join('')}</select><input id="hn${i}" value="${esc(q.nt||'')}" placeholder="หมายเหตุเวร"><button onclick="hSave(${i})">บันทึก</button><button class="d" onclick="hDel(${i})">ลบเวรนี้</button></div></details>`).join('')||'<p class="mu">ยังไม่มีประวัติ</p>'}</div>`}
const nav=()=>`<div class="nav"><button class="${U.v==='h'?'on':''}" onclick="setV('h')">หน้าแรก</button><button class="${U.v==='b'?'on':''}" onclick="setV('b')">เตียงทั้งหมด</button><button onclick="tgSnd()">${S.snd?'🔔 เสียงเปิด':'🔕 เสียงปิด'}</button><button style="margin-left:auto" onclick="const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light'">สลับโหมดสว่าง/มืด</button></div>`;
function render(){$('sh').textContent=shift();$('app').innerHTML=nav()+(U.v==='h'?home():U.v==='b'?board():detail())}
const epF=p=>`<div class="card"><h3>แก้ข้อมูลผู้ป่วย / ย้ายเตียง</h3><div class="f"><input id="eb" value="${esc(p.b)}" size="6" placeholder="เตียง"><input id="en" value="${esc(p.n)}" placeholder="ชื่อย่อ"><input id="ea" type="number" value="${p.a}" placeholder="อายุ" style="width:80px">${dsel('ek',p.k)}<button class="p" onclick="saveP()">บันทึก</button><button onclick="U.ep=0;render()">ยกเลิก</button></div><p class="mu" id="em">เปลี่ยนเลขเตียงเพื่อย้ายเตียง ถ้าเปลี่ยนโรค ระบบจะเพิ่มชุดข้อวินิจฉัยของโรคใหม่ให้ (ของเดิมยังอยู่)</p></div>`;
function saveP(){const p=P(),b=val('eb');if(!b)return;if(S.p.some(q=>q!==p&&q.b===b)){$('em').textContent='มีเตียง '+b+' อยู่แล้ว';return}p.b=b;p.n=val('en');p.a=num('ea')||'';const k=$('ek').value;if(k!==p.k){p.k=k;mkND(k).forEach(n=>{if(!p.nd.some(m=>m.t===n.t))p.nd.push(n)})}U.ep=0;save()}
const vsFill=l=>{const x=l?lastVs(P()):{tp:36.8,hr:80,rr:18,sb:120,sp:98,o2:0,av:0,gcs:15,pn:0};if(x)fill({v1:x.tp,v2:x.hr,v3:x.rr,v4:x.sb,v5:x.sp,v6:x.o2,v7:x.av,v8:x.gcs||'',v9:x.pn||''})};
function trend(vs){const d=vs.slice(-12);if(d.length<2)return'<p class="mu">บันทึก V/S อย่างน้อย 2 ครั้งเพื่อดูกราฟแนวโน้ม</p>';const W=240,bw=W/d.length,ns=d.map(news);
return`<h3>แนวโน้ม NEWS (${d.length} ครั้งล่าสุด)</h3><svg viewBox="0 0 ${W} 60" width="100%" height="70" role="img" aria-label="แนวโน้ม NEWS">${ns.map((s,i)=>`<rect x="${i*bw+2}" y="${58-s*2.8}" width="${bw-4}" height="${s*2.8+2}" rx="3" fill="var(${s>=7?'--rd':s>=5?'--wn':'--ok'})"/>`).join('')}<line x1="0" x2="${W}" y1="44" y2="44" stroke="var(--wn)" stroke-dasharray="3"/></svg><div class="mu">เส้นประ = NEWS 5 (แจ้งแพทย์)</div>${[['T °C','tp'],['HR','hr'],['RR','rr'],['SBP','sb'],['SpO2','sp']].map(([n,k])=>`<div class="row"><span>${n}</span>${spark(d.map(x=>({v:x[k]})))}<b>${d[d.length-1][k]}</b></div>`).join('')}`}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.4)}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
let seen=new Set();
function chk(q){const k=new Set(S.p.flatMap(alerts).map(a=>a.replace(/(\d+ ชม\. )?\d+ นาที/g,'')));if(!q&&S.snd&&[...k].some(x=>!seen.has(x)))beep();seen=k}
const tgSnd=()=>{S.snd=!S.snd;if(S.snd)beep();save()};
chk(1);render();setInterval(()=>chk(),15000);setInterval(()=>{const a=document.activeElement;if((!a||!/INPUT|SELECT|TEXTAREA/.test(a.tagName))&&!document.querySelector('details[open]')&&!['nb','nn','na','dn','dt2'].some(i=>$(i)&&$(i).value))render()},3e4);
</script></body></html>
